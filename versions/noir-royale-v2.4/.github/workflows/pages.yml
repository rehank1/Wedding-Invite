name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', '**.md', 'tests/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content.json
        run: node -e "JSON.parse(require('fs').readFileSync('site/content/content.json','utf8'))"
      - name: Build (photos → AVIF/WebP, Amiri subset, CSS inline, CSP hashes)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
