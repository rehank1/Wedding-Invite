name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ci
      - name: Lighthouse
        run: |
          node scripts/serve.mjs dist 4173 &
          sleep 1
          CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())") node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
